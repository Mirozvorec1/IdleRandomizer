<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Randomizer — Игра</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/game.css">
<script defer src="js/common.js"></script>
<script defer src="js/game.js"></script>
</head>
<body>

<div class="wrap">
  <header>
    <a class="back" href="index.html" id="backBtn" title="Меню" aria-label="Меню">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11 12 3l9 8"/>
        <path d="M5.5 9.5V21h13V9.5"/>
        <path d="M10 21v-6h4v6"/>
      </svg>
    </a>
    <button class="gear gear--game" id="gearBtn" type="button" title="Настройки" aria-label="Настройки">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <div class="points-wrap" id="pointsWrap">
      <div class="stat-cell">
        <span class="stat-label">Очки</span>
        <span class="stat-value" id="points">0</span>
      </div>
      <div class="stat-cell">
        <span class="stat-label">Рекорд</span>
        <span class="stat-value" id="record">0</span>
      </div>
      <div class="combo-record" id="comboRecord">
        <span class="cr-label">Комбо-рекорд</span>
        <span class="cr-value" id="comboRecordValue">—</span>
      </div>
    </div>
  </header>

  <section class="card card-gen">
    <div class="number-box">
      <div class="number" id="number">?</div>
      <div class="result-label" id="resultLabel">▶</div>
      <div class="combo-badge" id="comboBadge">Комбо ×1</div>
      <div class="history" id="history"></div>
    </div>

    <div class="gen-wrap">
      <div class="range-row" id="rangeRow">
        <label>
          <span>Минимум</span>
          <b id="rangeValue">1 – 100</b>
        </label>
        <div class="slider" id="rangeSlider" tabindex="0">
          <div class="track"></div>
          <div class="ticks" id="sliderTicks"></div>
          <div class="thumb" id="sliderThumb"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="gen-dock">
  <button class="generate-btn" id="generateBtn">
    <span class="cd-fill" id="cdFill"></span>
    <span class="cd-text" id="cdText">🎲 Генерировать</span>
  </button>
</div>

<div class="shop-drawer" id="shopDrawer">
  <section class="card shop-panel" id="shopPanel">
    <div class="shop-inner">
      <h2>Магазин</h2>
      <div class="shop-grid">
      <div class="shop-item">
        <div class="icon">⚡</div>
        <div class="body">
          <div class="name">Кулдаун</div>
          <div class="desc">−0.25 с за уровень.</div>
          <div class="meta">
            <span class="level" id="cdLevel">Ур. 0/11</span>
            <span class="val" id="cdVal">3.00 с</span>
          </div>
        </div>
        <button class="buy-btn" id="buyCd">Купить</button>
      </div>

      <div class="shop-item">
        <div class="icon">🎚️</div>
        <div class="body">
          <div class="name">Минимум диапазона</div>
          <div class="desc">+1 к ползунку за уровень.</div>
          <div class="meta">
            <span class="level" id="rangeLevel">Ур. 0/100</span>
            <span class="val" id="rangeVal">Макс. броска: 100 · ползунок до 1</span>
          </div>
        </div>
        <button class="buy-btn" id="buyRange">Купить</button>
      </div>
      </div>
    </div>
  </section>

  <button class="shop-tab" id="shopTab" title="Магазин" aria-label="Магазин" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="20" r="1.6"/>
      <circle cx="17" cy="20" r="1.6"/>
      <path d="M3 4h2l2.4 10.5a1.5 1.5 0 0 0 1.5 1.2h7.6a1.5 1.5 0 0 0 1.5-1.2L20 7H6"/>
    </svg>
  </button>
</div>

<div class="combo-tip" id="comboTip"></div>

</body>
</html>
