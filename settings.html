<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Randomizer — Настройки</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/settings.css">
<script defer src="js/common.js"></script>
<script defer src="js/settings.js"></script>
</head>
<body class="page-center">

<a class="back" href="index.html" id="backBtn" title="Назад" aria-label="Назад">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11 12 3l9 8"/>
    <path d="M5.5 9.5V21h13V9.5"/>
    <path d="M10 21v-6h4v6"/>
  </svg>
</a>

<div class="menu">
  <h1>НАСТРОЙКИ</h1>

  <div class="setting-row">
    <div class="setting-info">
      <div class="setting-title">Мигание кнопки магазина</div>
      <div class="setting-desc">Жёлтое свечение у вкладки, когда хватает на покупку</div>
    </div>
    <div class="switch" id="swShopGlow" role="switch" aria-label="Мигание кнопки магазина"><span class="knob"></span></div>
  </div>

  <div class="setting-row">
    <div class="setting-info">
      <div class="setting-title">Список последних цифр</div>
      <div class="setting-desc">Показывать историю выпавших чисел в игре</div>
    </div>
    <div class="switch" id="swHistory" role="switch" aria-label="Список последних цифр"><span class="knob"></span></div>
  </div>

  <div class="setting-row">
    <div class="setting-info">
      <div class="setting-title">Анимация переходов</div>
      <div class="setting-desc">Плавный переход с иконкой между страницами</div>
    </div>
    <div class="switch" id="swTransitions" role="switch" aria-label="Анимация переходов"><span class="knob"></span></div>
  </div>
</div>

</body>
</html>
